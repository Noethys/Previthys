<div class="row mb-3">
  <label class="col-md-3 col-form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
  <div class="col-md-7">
    {{ field }}
    {% if field.help_text %}<small class="form-text text-body-secondary">{{ field.help_text }}</small>{% endif %}
    {% for erreur in field.errors %}<div class="text-danger small">{{ erreur }}</div>{% endfor %}
  </div>
</div>
